# ── Add inside the existing `server { server_name tech.fhl.net; }` block ──
# New UI (FastAPI + React, Sonnet 5 / v4 engine) at tech.fhl.net/bible_bot/
# Runs on port 7861 alongside the old Gradio app (7860, /bible_tool_bot/).
# After adding: nginx -t && systemctl reload nginx

location /bible_bot/api/ {
    proxy_pass http://127.0.0.1:7861/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;              # required for SSE streaming
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# FastAPI also serves the built SPA itself, so a simple proxy is enough
# (no need for nginx to serve web/dist directly, and no extra root config).
location /bible_bot/ {
    proxy_pass http://127.0.0.1:7861/bible_bot/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
}
