name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build   # tsc -b && vite build

  backend:
    name: Backend compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"   # matches the production venv
      # Compile-only on purpose: importing the engine fetches the FHL book
      # table over the network, and chat tests cost real tokens. Runtime
      # verification happens on the server via e2e/verify-*.mjs (see
      # CODEBASE.md → Testing & release checklist).
      - run: python -m compileall -q server scripts
